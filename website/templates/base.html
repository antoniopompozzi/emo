<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <meta name="description" content="EMO -- a daily pixelated duotone image generated from the day's world news.">
  <meta property="og:title" content="{{ site_title }}">
  <meta property="og:description" content="EMO -- a daily pixelated duotone image generated from the day's world news.">
  {% if page_url %}
  <meta property="og:url" content="{{ page_url }}">
  {% endif %}
  {% if share_url %}
  <meta property="og:image" content="{{ share_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ share_url }}">
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
  {% block content %}{% endblock %}
  <script src="{{ root }}static/script.js" defer></script>
</body>
</html>
