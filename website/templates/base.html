<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ root }}index.html">{{ site_title }}</a>
    <p class="site-tagline">A daily pixelated portrait of the world's news, chosen freely by an AI.</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Generated automatically every day from world news headlines.</p>
  </footer>
</body>
</html>
