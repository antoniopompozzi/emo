{# The SHARE dialog (card preview + download link + copy-link button),
   opened by #share-btn -- see initShareButton in script.js. Included by
   _hero.html. #}
<dialog id="share-modal" class="why-modal">
  <button type="button" class="modal-close" id="share-modal-close" aria-label="Close">&times;</button>
  <h2>SHARE</h2>
  <img id="share-preview" class="share-preview" alt="Share card preview">
  <p class="share-actions">
    <a id="share-download" class="pixel-btn" download="emo-{{ day.date }}.png">DOWNLOAD</a>
    <button type="button" class="pixel-btn" id="share-copy-link">COPY LINK</button>
  </p>
</dialog>
