{% extends "base.html" %}
{% block title %}Archive — {{ site_title }}{% endblock %}
{% block content %}
<div class="archive-page">
  <header class="archive-header">
    <a class="brand-label-inline" href="{{ root }}index.html">EMO</a>
    <h1>ARCHIVE</h1>
  </header>

  {% include "_ai_disclosure.html" %}

  {% if days %}
  <div class="gallery-grid">
    {% for d in days %}
    <a class="gallery-item" href="{{ root }}days/{{ d._dir_name }}/" title="{{ d.date }}">
      <img src="{{ root }}days/{{ d._dir_name }}/final.png" alt="EMO's image for {{ d.date }}"
           loading="lazy" width="150" height="150">
      <span>{{ d.date }}</span>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <p>No images have been published yet.</p>
  {% endif %}
</div>
{% endblock %}
