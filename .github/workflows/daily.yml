name: Daily EMO run

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC every day
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.main

      - name: Commit new archive entry
        run: |
          git config user.name "emo-bot"
          git config user.email "actions@github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
          else
            git commit -m "EMO: add $(date -u +%Y-%m-%d) archive entry"
            git push
          fi

      - name: Build site
        run: python website/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
