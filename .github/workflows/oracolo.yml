name: Weekly ORACLE run

on:
  workflow_run:
    workflows: ["Daily EMO run"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run_oracle: ${{ steps.weekday.outputs.run_oracle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # This workflow fires every time "Daily EMO run" finishes, whether
      # it succeeded or not -- GitHub Actions has no built-in filter for
      # that on workflow_run, so this step checks the upstream
      # conclusion itself. A manual dispatch has no upstream run to
      # check and always proceeds.
      - name: Check upstream Daily EMO run succeeded
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Daily EMO run did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}); skipping ORACLE."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # ORACLE only actually generates on Wednesday (weekly cadence) or
      # on a manual dispatch (to test a real run before merging) -- every
      # other day this workflow still fires (see the trigger above) but
      # every remaining step below is skipped.
      - name: Check it is Wednesday
        id: weekday
        if: steps.guard.outputs.proceed == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "3" ]; then
            echo "run_oracle=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not Wednesday and not a manual dispatch; skipping ORACLE generation this run."
            echo "run_oracle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run weekly ORACLE pipeline
        if: steps.weekday.outputs.run_oracle == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m pipeline.oracle_main

      - name: Commit new oracle_archive entry
        if: steps.weekday.outputs.run_oracle == 'true'
        run: |
          git config user.name "emo-bot"
          git config user.email "actions@github.com"
          git add oracle_archive/
          if git diff --cached --quiet; then
            echo "No oracle_archive changes to commit"
          else
            git commit -m "ORACLE: add $(date -u +%Y-%m-%d) archive entry"
            git push
          fi

      - name: Build site
        if: steps.weekday.outputs.run_oracle == 'true'
        run: python website/build_site.py

      - name: Upload Pages artifact
        if: steps.weekday.outputs.run_oracle == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Guards the live site the same way daily.yml's deploy job does, plus
    # skips deploy entirely on a run where build's steps above were
    # skipped (not Wednesday, not a manual dispatch, or the upstream
    # Daily EMO run failed) -- there is no new Pages artifact to deploy
    # on those runs.
    if: github.ref == 'refs/heads/main' && needs.build.outputs.run_oracle == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
