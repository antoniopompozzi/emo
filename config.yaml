# EMO pipeline configuration.
# Everything that is safe to tune without touching code lives here.

news:
  primary_feed_url: "http://feeds.bbci.co.uk/news/world/rss.xml"
  fallback_feed_url: "https://news.google.com/rss/headlines/section/topic/WORLD?hl=en-US&gl=US&ceid=US:en"
  max_items: 12
  request_timeout_seconds: 15
  dedup_window_days: 30  # giorni indietro da controllare per evitare doppioni; null = tutto l'archivio

claude:
  model: "claude-haiku-4-5-20251001"
  max_tokens: 1024
  request_timeout_seconds: 30
  max_retries: 3
  retry_backoff_seconds: 5

openai_image:
  model: "gpt-image-1.5"
  quality: "medium"
  size: "1024x1024"
  request_timeout_seconds: 90
  max_retries: 4
  retry_backoff_seconds: 10

postprocess:
  grid_size: 96      # cells per side of the pixelation grid
  gray_levels: 10    # number of quantized gray tones
  px_per_cell: 10    # output pixels per cell -> final image is grid_size * px_per_cell

site:
  title: "EMO"
  base_url: "https://emopixels.xyz/"  # used to build absolute URLs for Open Graph meta tags

share_card:
  size: 1080

oracle:
  image_size: "1536x1024"    # unico formato panoramico nativo di gpt-image-1.5 (vedi nota in CLAUDE.md)
  grid_cols: 144              # 96 * 1.5, stessa densita' di cella di EMO
  grid_rows: 96                # identico a postprocess.grid_size: stessa altezza in celle di EMO
  positive_color: "#f3ead9"    # bianco panna
  negative_color: "#5c1620"    # rosso scuro

paths:
  archive_dir: "archive"
  oracle_archive_dir: "oracle_archive"   # radice separata da archive_dir, vedi pipeline/oracle_archive.py
  site_output_dir: "_site"
